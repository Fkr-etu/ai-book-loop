[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-book-loop"
version = "0.1.0"
description = "Chapter-by-chapter AI-assisted book writing workflow"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=23.1.0",
  "email-validator>=2.0.0",
  "fastapi>=0.141.1",
  "google-genai>=1.0.0",
  "langgraph>=0.6,<1.0",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "pyjwt>=2.8.0",
  "python-dotenv>=1.0,<2.0",
  "python-multipart>=0.0.9",
  "uvicorn>=0.52.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=6.0,<7.0",
]
nlp = [
  "spacy>=3.8,<4.0",
]

[project.scripts]
book-loop = "book_loop.cli.main:main"

[tool.setuptools.packages.find]
include = ["book_loop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
