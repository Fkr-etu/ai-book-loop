name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: book_loop
          POSTGRES_PASSWORD: book_loop
          POSTGRES_DB: book_loop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U book_loop -d book_loop_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://book_loop:book_loop@localhost:5432/book_loop_test
      LLM_PROVIDER: fake
      GEMINI_API_KEY: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  e2e:
    name: Frontend E2E (zero-cost)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      # E2E deliberately uses the local deterministic API facade.
      # No backend credentials or Gemini key are provided to this job.
      NEXT_PUBLIC_USE_REAL_API: "false"
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build E2E app
        run: npm run build

      - name: Run Playwright E2E
        run: npm run test:e2e
