name: GCP deployment validation

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'cloudbuild.yaml'
      - 'web/**'
      - 'book_loop/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/gcp-deployment-validation.yml'
  push:
    branches:
      - main
      - release

jobs:
  container-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t book-loop-api:test .

      - name: Build frontend image
        run: docker build --build-arg NEXT_PUBLIC_API_URL=https://book-loop-api.example.invalid -t book-loop-web:test web
