name: Canon E2E Validation

on:
  workflow_dispatch:
    inputs:
      book_title:
        description: "Book scenario to validate"
        required: true
        default: "Les Veilleurs de Marseille"
        type: string

permissions:
  contents: read

jobs:
  canon-e2e:
    name: Canon E2E — ${{ inputs.book_title }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Validate Canon pipeline
        env:
          CANON_BOOK_TITLE: ${{ inputs.book_title }}
        run: |
          echo "=== Canon E2E Validation ==="
          echo "Book: ${CANON_BOOK_TITLE}"
          echo ""
          echo "Extraction Canon"
          echo "Validation d'assertions"
          echo "Promotion Canon"
          echo "Nouvelle génération"
          echo "Vérification du prompt"
          pytest -q tests/test_canon_e2e_validation.py -s

      - name: Upload validation database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canon-e2e-validation
          path: "**/canon.db"
          if-no-files-found: ignore
          retention-days: 7
