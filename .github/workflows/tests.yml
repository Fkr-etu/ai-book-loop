name: Tests

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: book_loop
          POSTGRES_PASSWORD: book_loop
          POSTGRES_DB: book_loop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U book_loop -d book_loop_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://book_loop:book_loop@localhost:5432/book_loop_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Run tests
        run: pytest
