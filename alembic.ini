[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .

# DATABASE_URL is the runtime source of truth. This placeholder uses the
# project's psycopg v3 SQLAlchemy driver explicitly.
sqlalchemy.url = postgresql+psycopg://book_loop:book_loop@localhost:5432/book_loop

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
