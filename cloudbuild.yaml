substitutions:
  _REGION: europe-west9
  _API_SERVICE: book-loop-api
  _WEB_SERVICE: book-loop-web
  _API_REPOSITORY: book-loop-api
  _WEB_REPOSITORY: book-loop-web
  _DB_INSTANCE: book-loop-postgres
  _API_SERVICE_ACCOUNT: book-loop-api@gen-lang-client-0322058604.iam.gserviceaccount.com
  _MIGRATION_SERVICE_ACCOUNT: book-loop-migrations@gen-lang-client-0322058604.iam.gserviceaccount.com
  _API_URL: ""
  _USE_REAL_API: "false"

steps:
  # Pull the previous images in parallel so Docker can reuse unchanged layers.
  - id: pull-api-cache
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - "-c"
      - "docker pull ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_API_REPOSITORY}/api:latest || exit 0"
    waitFor: ["-"]

  - id: pull-web-cache
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - "-c"
      - "docker pull ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_WEB_REPOSITORY}/web:latest || exit 0"
    waitFor: ["-"]

  # API and Web builds are independent and run concurrently.
  - id: build-api
    name: gcr.io/cloud-builders/docker
    waitFor: [pull-api-cache]
    args:
      - "build"
      - "--cache-from"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_API_REPOSITORY}/api:latest"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_API_REPOSITORY}/api:$BUILD_ID"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_API_REPOSITORY}/api:latest"
      - "."

  - id: build-web
    name: gcr.io/cloud-builders/docker
    waitFor: [pull-web-cache]
    args:
      - "build"
      - "--cache-from"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_WEB_REPOSITORY}/web:latest"
      - "--build-arg"
      - "NEXT_PUBLIC_API_URL=${_API_URL}"
      - "--build-arg"
      - "NEXT_PUBLIC_USE_REAL_API=${_USE_REAL_API}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_WEB_REPOSITORY}/web:$BUILD_ID"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_WEB_REPOSITORY}/web:latest"
      - "./web"

  # Push API and Web images independently, in parallel.
  - id: push-api
    name: gcr.io/cloud-builders/docker
    waitFor: [build-api]
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_API_REPOSITORY}/api:$BUILD_ID"

  - id: push-api-cache
    name: gcr.io/cloud-builders/docker
    waitFor: [build-api]
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_API_REPOSITORY}/api:latest"

  - id: push-web
    name: gcr.io/cloud-builders/docker
    waitFor: [build-web]
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_WEB_REPOSITORY}/web:$BUILD_ID"

  - id: push-web-cache
    name: gcr.io/cloud-builders/docker
    waitFor: [build-web]
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_WEB_REPOSITORY}/web:latest"

  # Migrations remain a strict barrier before either deployment.
  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    waitFor: [push-api]
    args:
      - "run"
      - "jobs"
      - "deploy"
      - "book-loop-migrations"
      - "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_API_REPOSITORY}/api:$BUILD_ID"
      - "--region=${_REGION}"
      - "--service-account=${_MIGRATION_SERVICE_ACCOUNT}"
      - "--set-secrets=DATABASE_URL=DATABASE_URL:latest"
      - "--set-cloudsql-instances=$PROJECT_ID:${_REGION}:${_DB_INSTANCE}"
      - "--command=alembic"
      - "--args=upgrade,head"

  - id: execute-migrations
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    waitFor: [migrate]
    args:
      - "run"
      - "jobs"
      - "execute"
      - "book-loop-migrations"
      - "--region=${_REGION}"
      - "--wait"

  # API and Web deployments run concurrently after migrations succeed.
  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    waitFor: [execute-migrations, push-api]
    args:
      - "run"
      - "deploy"
      - "${_API_SERVICE}"
      - "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_API_REPOSITORY}/api:$BUILD_ID"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--service-account=${_API_SERVICE_ACCOUNT}"
      - "--add-cloudsql-instances=$PROJECT_ID:${_REGION}:${_DB_INSTANCE}"
      - "--set-secrets=DATABASE_URL=DATABASE_URL:latest,GEMINI_API_KEY=GEMINI_API_KEY:1,AUTH_SECRET_KEY=AUTH_SECRET_KEY:latest"
      - "--min=0"
      - "--max=3"
      - "--cpu=1"
      - "--memory=512Mi"
      - "--concurrency=8"
      - "--port=8080"

  - id: deploy-web
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    waitFor: [execute-migrations, push-web]
    args:
      - "run"
      - "deploy"
      - "${_WEB_SERVICE}"
      - "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_WEB_REPOSITORY}/web:$BUILD_ID"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--min=0"
      - "--max=2"
      - "--cpu=1"
      - "--memory=512Mi"
      - "--concurrency=40"
      - "--port=8080"
