substitutions:
  _REGION: europe-west9
  _API_SERVICE: book-loop-api
  _WORKER_SERVICE: book-loop-analysis-worker
  _WEB_SERVICE: book-loop-web
  _API_REPOSITORY: book-loop-api
  _WEB_REPOSITORY: book-loop-web
  _DB_INSTANCE: book-loop-postgres
  _API_SERVICE_ACCOUNT: book-loop-api@gen-lang-client-0322058604.iam.gserviceaccount.com
  _MIGRATION_SERVICE_ACCOUNT: book-loop-migrations@gen-lang-client-0322058604.iam.gserviceaccount.com
  _USE_REAL_API: "true"
  _GA4_MEASUREMENT_ID: ""

steps:
  - id: pull-api-cache
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - "-c"
      - "docker pull ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_API_REPOSITORY}/api:latest || exit 0"
    waitFor: ["-"]

  - id: pull-web-cache
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - "-c"
      - "docker pull ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_WEB_REPOSITORY}/web:latest || exit 0"
    waitFor: ["-"]

  - id: build-api
    name: gcr.io/cloud-builders/docker
    waitFor: [pull-api-cache]
    args:
      - "build"
      - "--cache-from"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_API_REPOSITORY}/api:latest"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_API_REPOSITORY}/api:$BUILD_ID"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_API_REPOSITORY}/api:latest"
      - "."

  - id: push-api
    name: gcr.io/cloud-builders/docker
    waitFor: [build-api]
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_API_REPOSITORY}/api:$BUILD_ID"

  - id: push-api-cache
    name: gcr.io/cloud-builders/docker
    waitFor: [build-api]
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_API_REPOSITORY}/api:latest"

  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    waitFor: [push-api]
    args:
      - "run"
      - "jobs"
      - "deploy"
      - "book-loop-migrations"
      - "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_API_REPOSITORY}/api:$BUILD_ID"
      - "--region=${_REGION}"
      - "--service-account=${_MIGRATION_SERVICE_ACCOUNT}"
      - "--set-secrets=DATABASE_URL=DATABASE_URL:latest"
      - "--set-cloudsql-instances=$PROJECT_ID:${_REGION}:${_DB_INSTANCE}"
      - "--command=alembic"
      - "--args=upgrade,head"

  - id: execute-migrations
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    waitFor: [migrate]
    args:
      - "run"
      - "jobs"
      - "execute"
      - "book-loop-migrations"
      - "--region=${_REGION}"
      - "--wait"

  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    waitFor: [execute-migrations, push-api]
    args:
      - "run"
      - "deploy"
      - "${_API_SERVICE}"
      - "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_API_REPOSITORY}/api:$BUILD_ID"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--service-account=${_API_SERVICE_ACCOUNT}"
      - "--add-cloudsql-instances=$PROJECT_ID:${_REGION}:${_DB_INSTANCE}"
      - "--set-secrets=DATABASE_URL=DATABASE_URL:latest,GEMINI_API_KEY=GEMINI_API_KEY:1,AUTH_SECRET_KEY=AUTH_SECRET_KEY:latest"
      - "--set-env-vars=APP_ENVIRONMENT=production,AUTH_COOKIE_SECURE=true,AUTH_COOKIE_SAMESITE=lax"
      - "--min=0"
      - "--max=3"
      - "--cpu=1"
      - "--memory=512Mi"
      - "--concurrency=8"
      - "--port=8080"

  - id: deploy-analysis-worker
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    waitFor: [execute-migrations, push-api]
    args:
      - "run"
      - "deploy"
      - "${_WORKER_SERVICE}"
      - "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_API_REPOSITORY}/api:$BUILD_ID"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--no-allow-unauthenticated"
      - "--service-account=${_API_SERVICE_ACCOUNT}"
      - "--add-cloudsql-instances=$PROJECT_ID:${_REGION}:${_DB_INSTANCE}"
      - "--set-secrets=DATABASE_URL=DATABASE_URL:latest,GEMINI_API_KEY=GEMINI_API_KEY:1,AUTH_SECRET_KEY=AUTH_SECRET_KEY:latest"
      - "--set-env-vars=APP_ENVIRONMENT=production,AUTH_COOKIE_SECURE=true,AUTH_COOKIE_SAMESITE=lax,ANALYSIS_JOB_POLL_SECONDS=2,ANALYSIS_JOB_LEASE_SECONDS=900"
      - "--command=python"
      - "--args=-m,book_loop.worker"
      - "--min=1"
      - "--max=3"
      - "--cpu=1"
      - "--memory=512Mi"
      - "--concurrency=1"
      - "--no-cpu-throttling"
      - "--port=8080"
      - "--startup-probe=initialDelaySeconds=2,timeoutSeconds=2,periodSeconds=5,failureThreshold=12,httpGet.path=/health,httpGet.port=8080"
      - "--liveness-probe=initialDelaySeconds=10,timeoutSeconds=2,periodSeconds=10,failureThreshold=3,httpGet.path=/health,httpGet.port=8080"

  - id: verify-api-public-iam
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    waitFor: [deploy-api]
    args:
      - "-c"
      - |
        echo "Verifying public Cloud Run invoker policy for ${_API_SERVICE}"
        MEMBERS="$$(gcloud run services get-iam-policy "${_API_SERVICE}" \
          --region="${_REGION}" \
          --flatten='bindings[].members' \
          --filter='bindings.role=roles/run.invoker AND bindings.members=allUsers' \
          --format='value(bindings.members)')"
        test "$${MEMBERS}" = "allUsers" || {
          echo "ERROR: ${_API_SERVICE} is not publicly invokable by allUsers."
          echo "The --allow-unauthenticated deployment flag did not result in the required IAM binding."
          echo "Check Cloud Run IAM permissions and organization policy restrictions."
          exit 1
        }
        echo "Public IAM verification passed for ${_API_SERVICE}"

  - id: resolve-api-url
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    waitFor: [verify-api-public-iam]
    args:
      - "-c"
      - |
        API_URL="$$(gcloud run services describe "${_API_SERVICE}" \
          --region="${_REGION}" \
          --format='value(status.url)')"
        test -n "$${API_URL}"
        printf '%s\n' "$${API_URL}" > /workspace/api-url
        echo "API_URL=$${API_URL}"

  - id: build-web
    name: gcr.io/cloud-builders/docker
    waitFor: [resolve-api-url, pull-web-cache]
    entrypoint: bash
    args:
      - "-c"
      - |
        API_URL="$$(cat /workspace/api-url)"
        test -n "$${API_URL}"
        echo "Building web with server-side API proxy target"
        docker build \
          --cache-from "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_WEB_REPOSITORY}/web:latest" \
          --build-arg "API_INTERNAL_URL=$${API_URL}" \
          --build-arg "NEXT_PUBLIC_USE_REAL_API=${_USE_REAL_API}" \
          --build-arg "NEXT_PUBLIC_GA4_MEASUREMENT_ID=${_GA4_MEASUREMENT_ID}" \
          -t "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_WEB_REPOSITORY}/web:$BUILD_ID" \
          -t "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_WEB_REPOSITORY}/web:latest" \
          ./web

  - id: push-web
    name: gcr.io/cloud-builders/docker
    waitFor: [build-web]
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_WEB_REPOSITORY}/web:$BUILD_ID"

  - id: push-web-cache
    name: gcr.io/cloud-builders/docker
    waitFor: [build-web]
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_WEB_REPOSITORY}/web:latest"

  - id: deploy-web
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    waitFor: [execute-migrations, push-web]
    args:
      - "run"
      - "deploy"
      - "${_WEB_SERVICE}"
      - "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_WEB_REPOSITORY}/web:$BUILD_ID"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--min=0"
      - "--max=2"
      - "--cpu=1"
      - "--memory=512Mi"
      - "--concurrency=40"
      - "--port=8080"

  - id: verify-web-public-iam
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    waitFor: [deploy-web]
    args:
      - "-c"
      - |
        echo "Verifying public Cloud Run invoker policy for ${_WEB_SERVICE}"
        MEMBERS="$$(gcloud run services get-iam-policy "${_WEB_SERVICE}" \
          --region="${_REGION}" \
          --flatten='bindings[].members' \
          --filter='bindings.role=roles/run.invoker AND bindings.members=allUsers' \
          --format='value(bindings.members)')"
        test "$${MEMBERS}" = "allUsers" || {
          echo "ERROR: ${_WEB_SERVICE} is not publicly invokable by allUsers."
          echo "The --allow-unauthenticated deployment flag did not result in the required IAM binding."
          echo "Check Cloud Run IAM permissions and organization policy restrictions."
          exit 1
        }
        echo "Public IAM verification passed for ${_WEB_SERVICE}"

  - id: resolve-web-url
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    waitFor: [verify-web-public-iam]
    args:
      - "-c"
      - |
        WEB_ORIGIN="$$(gcloud run services describe "${_WEB_SERVICE}" \
          --region="${_REGION}" \
          --format='value(status.url)')"
        test -n "$${WEB_ORIGIN}"
        printf '%s\n' "$${WEB_ORIGIN}" > /workspace/web-url
        echo "WEB_ORIGIN=$${WEB_ORIGIN}"

  - id: sync-api-cors
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    waitFor: [resolve-web-url]
    args:
      - "-c"
      - |
        WEB_ORIGIN="$$(cat /workspace/web-url)"
        test -n "$${WEB_ORIGIN}"
        echo "Synchronizing API CORS with WEB_ORIGIN=$${WEB_ORIGIN}"
        gcloud run services update ${_API_SERVICE} \
          --region=${_REGION} \
          --update-env-vars="CORS_ALLOWED_ORIGINS=[\"$${WEB_ORIGIN}\"]"

  - id: verify-api-cors
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    waitFor: [sync-api-cors]
    args:
      - "-c"
      - |
        WEB_ORIGIN="$$(gcloud run services describe "${_WEB_SERVICE}" \
          --region="${_REGION}" \
          --format='value(status.url)')"
        API_URL="$$(gcloud run services describe "${_API_SERVICE}" \
          --region="${_REGION}" \
          --format='value(status.url)')"
        test -n "$${WEB_ORIGIN}"
        test -n "$${API_URL}"
        echo "Expected WEB_ORIGIN=$${WEB_ORIGIN}"
        echo "Expected API_URL=$${API_URL}"
        ACTUAL="$$(gcloud run services describe ${_API_SERVICE} \
          --region=${_REGION} \
          --format='value(spec.template.spec.containers[0].env)' | tr '\n' ' ')"
        echo "API environment after CORS sync: $${ACTUAL}"
        echo "$${ACTUAL}" | grep -F "CORS_ALLOWED_ORIGINS" | grep -F "$${WEB_ORIGIN}"
        echo "Running CORS preflight verification"
        RESPONSE_FILE=/tmp/cors-response
        HTTP_CODE="$$(curl -sS -o "$${RESPONSE_FILE}" -w '%{http_code}' \
          -X OPTIONS "$${API_URL}/api/books" \
          -H "Origin: $${WEB_ORIGIN}" \
          -H 'Access-Control-Request-Method: GET')"
        echo "CORS preflight HTTP status: $${HTTP_CODE}"
        test "$${HTTP_CODE}" = "200"
        grep -Fi "access-control-allow-origin: $${WEB_ORIGIN}" "$${RESPONSE_FILE}"
        echo "CORS preflight verification passed"
