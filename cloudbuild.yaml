steps:
  # ---------------------------------------------------------------------------
  # Backend image
  # ---------------------------------------------------------------------------
  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_API_REPOSITORY}/book-loop-api:$COMMIT_SHA
      - -f
      - Dockerfile
      - .

  - id: push-api
    name: gcr.io/cloud-builders/docker
    waitFor: [build-api]
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_API_REPOSITORY}/book-loop-api:$COMMIT_SHA

  # ---------------------------------------------------------------------------
  # API service
  # ---------------------------------------------------------------------------
  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    waitFor: [push-api]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_API_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_API_REPOSITORY}/book-loop-api:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --service-account=book-loop-api@$PROJECT_ID.iam.gserviceaccount.com
      - --add-cloudsql-instances=$PROJECT_ID:${_REGION}:${_DB_INSTANCE}
      - --set-secrets=DATABASE_URL=DATABASE_URL:1,GEMINI_API_KEY=GEMINI_API_KEY:1,AUTH_SECRET_KEY=AUTH_SECRET_KEY:1
      - --set-env-vars=AUTH_COOKIE_SECURE=true,AUTH_COOKIE_SAMESITE=lax
      - --min=0
      - --max=3
      - --cpu=1
      - --memory=1Gi
      - --concurrency=8
      - --timeout=300
      - --allow-unauthenticated

  - id: api-url
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    waitFor: [deploy-api]
    entrypoint: bash
    args:
      - -ceu
      - |
        gcloud run services describe ${_API_SERVICE} \
          --region=${_REGION} \
          --format='value(status.url)' > /workspace/api-url

  # ---------------------------------------------------------------------------
  # Database migrations: dedicated Cloud Run Job, never at service startup.
  # ---------------------------------------------------------------------------
  - id: deploy-migration-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    waitFor: [push-api]
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ${_MIGRATION_JOB}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_API_REPOSITORY}/book-loop-api:$COMMIT_SHA
      - --region=${_REGION}
      - --service-account=book-loop-migrations@$PROJECT_ID.iam.gserviceaccount.com
      - --add-cloudsql-instances=$PROJECT_ID:${_REGION}:${_DB_INSTANCE}
      - --set-secrets=DATABASE_URL=DATABASE_URL:1
      - --command=alembic
      - --args=upgrade,head
      - --max-retries=1

  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    waitFor: [deploy-migration-job, api-url]
    entrypoint: gcloud
    args:
      - run
      - jobs
      - execute
      - ${_MIGRATION_JOB}
      - --region=${_REGION}
      - --wait

  # ---------------------------------------------------------------------------
  # Frontend image. NEXT_PUBLIC_* values are build-time values in Next.js.
  # ---------------------------------------------------------------------------
  - id: build-web
    name: gcr.io/cloud-builders/docker
    waitFor: [api-url, migrate]
    entrypoint: bash
    args:
      - -ceu
      - |
        API_URL="$(cat /workspace/api-url)"
        docker build \
          --build-arg NEXT_PUBLIC_API_URL="$$API_URL" \
          --build-arg NEXT_PUBLIC_USE_REAL_API="${_USE_REAL_API}" \
          -t "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_WEB_REPOSITORY}/book-loop-web:$COMMIT_SHA" \
          -f web/Dockerfile web

  - id: push-web
    name: gcr.io/cloud-builders/docker
    waitFor: [build-web]
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_WEB_REPOSITORY}/book-loop-web:$COMMIT_SHA

  - id: deploy-web
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    waitFor: [push-web]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_WEB_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_WEB_REPOSITORY}/book-loop-web:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --service-account=book-loop-api@$PROJECT_ID.iam.gserviceaccount.com
      - --min=0
      - --max=2
      - --cpu=1
      - --memory=512Mi
      - --concurrency=40
      - --timeout=60
      - --allow-unauthenticated

  # Configure API CORS after the web service has a stable Cloud Run URL.
  - id: configure-cors
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    waitFor: [deploy-web]
    entrypoint: bash
    args:
      - -ceu
      - |
        WEB_URL="$(gcloud run services describe ${_WEB_SERVICE} --region=${_REGION} --format='value(status.url)')"
        gcloud run services update ${_API_SERVICE} \
          --region=${_REGION} \
          --update-env-vars="CORS_ALLOWED_ORIGINS=[\"$$WEB_URL\"]"

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_API_REPOSITORY}/book-loop-api:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_WEB_REPOSITORY}/book-loop-web:$COMMIT_SHA

substitutions:
  _REGION: europe-west9
  _API_SERVICE: book-loop-api
  _WEB_SERVICE: book-loop-web
  _API_REPOSITORY: book-loop-api
  _WEB_REPOSITORY: book-loop-web
  _DB_INSTANCE: book-loop-postgres
  _MIGRATION_JOB: book-loop-migrations
  # Keep the frontend on mocks until the real API integration is explicitly enabled.
  _USE_REAL_API: "false"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1800s
